name: Comprobar y empaquetar
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npx prettier --check ../backend/tests/*.mjs ../backend/package.json ../global.json ../dotnet-tools.json
      - run: npm run lint
      - run: npm run typecheck:tests
      - run: npm test
      - run: node --test tools/serve.test.mjs
      - run: npm run build
      - run: npm run check:publication
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Comprobar receta Docker
        working-directory: .
        run: |
          docker build --tag routale:check .
          docker run --detach --name routale-check --publish 127.0.0.1:8088:8080 --health-interval=1s --health-start-period=1s routale:check
          trap 'docker stop routale-check > /dev/null' EXIT
          docker exec routale-check nginx -t
          for attempt in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' routale-check)" = healthy ]; then break; fi
            sleep 1
          done
          if [ "$(docker inspect --format '{{.State.Health.Status}}' routale-check)" != healthy ]; then
            docker logs routale-check
            exit 1
          fi
          curl --fail http://127.0.0.1:8088/health
          curl --fail http://127.0.0.1:8088/ > /dev/null
          node frontend/tools/check-http-security.mjs http://127.0.0.1:8088
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - run: node ../frontend/tools/prepare-seed.mjs
      - run: dotnet tool restore
      - run: dotnet restore Bitacora.slnx --locked-mode
      - run: dotnet format Bitacora.slnx --verify-no-changes --no-restore
      - run: npm run build
      - run: npm run check:migrations
      - run: npm run test:unit
      - run: npm test
  integration:
    name: Integración navegador, API y SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci
      - name: Restaurar herramientas .NET
        working-directory: backend
        run: dotnet tool restore
      - name: Restaurar solución .NET con lockfiles
        working-directory: backend
        run: dotnet restore Bitacora.slnx --locked-mode
      - name: Compilar API y pruebas .NET
        working-directory: backend
        run: dotnet build Bitacora.slnx --no-restore --configuration Debug
      - name: Instalar Chromium para Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Probar navegador contra API y SQLite reales
        working-directory: frontend
        run: npm run test:integration
  image:
    needs: [checks, backend, integration]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_IMAGE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      web_digest: ${{ steps.web.outputs.digest }}
      api_digest: ${{ steps.api.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadatos de las imágenes
        id: meta
        working-directory: .
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          version="$(node -p "require('./frontend/package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'La versión del paquete no es válida para la etiqueta OCI.' >&2
            exit 1
          fi
          echo "web_image=ghcr.io/$repository" >> "$GITHUB_OUTPUT"
          echo "api_image=ghcr.io/${repository}-api" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Construir y publicar frontend integrado con proxy HTTPS
        id: web
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          build-args: NGINX_CONFIG=deploy/nginx.stack.conf
          tags: ${{ steps.meta.outputs.web_image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
      - name: Construir y publicar API
        id: api
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.api_image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
      - name: Resumen de imágenes inmutables
        env:
          WEB_IMAGE: ${{ steps.meta.outputs.web_image }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          API_IMAGE: ${{ steps.meta.outputs.api_image }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
        run: |
          {
            echo '### Imágenes publicadas'
            printf -- '- Frontend: `%s:sha-%s` — `%s`\n' "$WEB_IMAGE" "$GITHUB_SHA" "$WEB_DIGEST"
            printf -- '- API: `%s:sha-%s` — `%s`\n' "$API_IMAGE" "$GITHUB_SHA" "$API_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
