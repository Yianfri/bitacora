name: Comprobar y empaquetar
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npx prettier --check ../backend/tests/*.mjs ../backend/package.json ../global.json ../dotnet-tools.json
      - run: npm run lint
      - run: npm run typecheck:tests
      - run: npm test
      - run: npm run build
      - run: npm run check:publication
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Comprobar receta Docker
        working-directory: .
        run: |
          docker build --tag routale:check .
          docker run --detach --name routale-check --publish 127.0.0.1:8088:8080 --health-interval=1s --health-start-period=1s routale:check
          trap 'docker stop routale-check > /dev/null' EXIT
          docker exec routale-check nginx -t
          for attempt in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' routale-check)" = healthy ]; then break; fi
            sleep 1
          done
          if [ "$(docker inspect --format '{{.State.Health.Status}}' routale-check)" != healthy ]; then
            docker logs routale-check
            exit 1
          fi
          curl --fail http://127.0.0.1:8088/health
          curl --fail http://127.0.0.1:8088/ > /dev/null
          node frontend/tools/check-http-security.mjs http://127.0.0.1:8088
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: node ../frontend/tools/prepare-seed.mjs
      - run: dotnet tool restore
      - run: dotnet restore Bitacora.slnx --locked-mode
      - run: dotnet format Bitacora.slnx --verify-no-changes --no-restore
      - run: npm run build
      - run: npm run check:migrations
      - run: npm run test:unit
      - run: npm test
  image:
    needs: [checks, backend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_IMAGE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nombre de imagen
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: echo "tag=ghcr.io/${REPOSITORY,,}:sha-$COMMIT" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tag }}
