# Copiar este archivo y .env a la carpeta de la stack en Dockge.
name: bitacora
services:
  web:
    image: ${BITACORA_IMAGE:?Define la imagen exacta en .env}
    restart: unless-stopped
    ports:
      - "${BITACORA_BIND_IP:-127.0.0.1}:${BITACORA_PORT:-8088}:8080"
    security_opt:
      - no-new-privileges:true
