server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 5m;
  add_header_inherit merge;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  location = /health { access_log off; default_type text/plain; return 200 'ok'; }
  location = /api/health {
    access_log off;
    proxy_pass http://api:8080/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
  }
  location /api/ {
    access_log off;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /ngsw.json { add_header Cache-Control "no-cache"; }
  location = /ngsw-worker.js { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
