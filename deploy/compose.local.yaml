# Desde la raíz: docker compose -f deploy/compose.local.yaml up -d --build
name: bitacora-local
services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: routale-api:local
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Storage__Directory: /data
      ReverseProxy__KnownProxies: ${BITACORA_WEB_IP:-172.30.40.2}
    volumes:
      - local_data:/data
    networks:
      private:
        ipv4_address: ${BITACORA_API_IP:-172.30.40.3}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NGINX_CONFIG: deploy/nginx.local.conf
    image: routale:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BITACORA_BIND_IP:-127.0.0.1}:${BITACORA_PORT:-8088}:8080"
    networks:
      edge: {}
      private:
        ipv4_address: ${BITACORA_WEB_IP:-172.30.40.2}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=1m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

volumes:
  local_data:
    name: routale_local_private_data

networks:
  edge: {}
  private:
    internal: true
    ipam:
      config:
        - subnet: ${BITACORA_NETWORK_SUBNET:-172.30.40.0/24}
          gateway: ${BITACORA_NETWORK_GATEWAY:-172.30.40.1}
